<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Last Will of Ashvale</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="frame">
    <header id="banner">
      <h1>The Last Will of Ashvale</h1>
      <div id="status">
        <span id="status-room">—</span>
        <span class="sep">·</span>
        <span id="status-turn">turn 0</span>
        <span class="sep">·</span>
        <span id="status-oil">lamp: unlit</span>
      </div>
    </header>

    <main id="transcript" aria-live="polite" aria-label="Game transcript"></main>

    <form id="input-form" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="input" name="input" type="text" autofocus
             autocapitalize="off" autocorrect="off" spellcheck="false"
             aria-label="Command input" />
    </form>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
